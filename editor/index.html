<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Radio 1965 - Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12100d;
      --fg: #f0e6d2;
      --accent: #42b649;
      --error: crimson;
      --field-bg: #201d18;
      --field-border: #3a362e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--fg);
      max-width: 640px;
      margin: 2em auto;
      padding: 0 1em;
    }
    label { display: block; margin-top: 1em; font-weight: bold; }
    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      font-size: 1em;
      padding: 0.5em;
      margin-top: 0.3em;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 4px;
      color: var(--fg);
    }
    input[type="checkbox"] { width: auto; }
    .row { display: flex; gap: 1em; align-items: center; }
    .row > * { flex: 1; }
    button {
      margin-top: 1.5em;
      padding: 0.6em 1.2em;
      background: var(--accent);
      color: #0a1a0b;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
    }
    pre {
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      padding: 1em;
      white-space: pre-wrap;
    }
    #lockScreen { max-width: 320px; margin: 4em auto; text-align: center; }
    #lockError { color: var(--error); min-height: 1.2em; }
  </style>
</head>
<body>
  <!-- Real server-side auth (project-description.md #10's "rewrite editor
       page, that requires e-mail and password" TODO) - logs in against
       server/main.py's POST /contributors/login, the same endpoint
       contributor/index.html uses. Only role "contributor"/"manager" is
       let through; "pending"/"banned" see an explanatory error instead. -->
  <div id="lockScreen">
    <h1>Radio 1965 - Editor</h1>
    <label>Email
      <input id="lockEmail" type="email" autofocus />
    </label>
    <label>Password
      <input id="lockPassword" type="password" />
    </label>
    <div id="lockError"></div>
    <button id="unlockButton" type="button">Log in</button>
  </div>

  <div id="appContent" style="display: none">
  <h1>Radio 1965 - New Event</h1>

  <form id="eventForm">
    <label>Title
      <input id="title" required />
    </label>

    <label>Summary (used in notification text)
      <textarea id="summary" rows="2" required></textarea>
    </label>

    <label>Type
      <select id="type">
        <option value="text" selected>text</option>
        <option value="audio">audio</option>
        <option value="video">video</option>
        <option value="livestream">livestream</option>
        <option value="article">article</option>
        <option value="webcontent">webcontent</option>
      </select>
    </label>

    <!-- type="text" only -->
    <label id="textFieldLabel">Text
      <textarea id="text" rows="8"></textarea>
    </label>

    <!-- all types except "text" -->
    <label id="urlFieldLabel">Content URL
      <input id="url" type="url" />
    </label>

    <!-- livestream only: when the broadcast itself is scheduled to start,
         distinct from "Announce at" below (when the notification/card
         appears - can be well before the stream actually starts) -->
    <label id="startsAtFieldLabel">Starts at
      <input id="startsAt" type="datetime-local" />
    </label>

    <label>
      <span class="row">
        <span>Announce at</span>
        <span><input id="publishNow" type="checkbox" checked /> Now</span>
        <span><input id="noNotification" type="checkbox" /> No notification</span>
      </span>
      <input id="publishAt" type="datetime-local" disabled />
    </label>

    <label>Put to shelf at <em>(optional - defaults to one day after publish)</em>
      <input id="shelfAt" type="datetime-local" />
    </label>

    <label>Tags (comma separated)
      <input id="tags" list="tagSuggestions" placeholder="news, interview, ..." />
      <datalist id="tagSuggestions"></datalist>
    </label>

    <button type="submit">Publish event</button>
  </form>

  <p>
    <em>
      Fields with no dedicated DB column are sent inside payload. "status" is
      set automatically by the server: 'current' if published now, otherwise
      'unpublished' until server/cron_publish.py sends the notification at
      publish_at.
    </em>
  </p>

  <h2>Result</h2>
  <pre id="log"></pre>
  </div>

  <script>
    // Notification server base URL - was an editable #serverUrl input,
    // now just a constant (nothing in practice ever pointed it anywhere
    // else, and the lock screen needs it before #appContent even exists).
    const SERVER_URL = "https://live.uuu.ee/radio1965/api";
    const LOGIN_API_BASE = SERVER_URL;
    const ACCESS_TOKEN_SESSION_KEY = "radio65EditorAccessToken";
    const ROLE_SESSION_KEY = "radio65EditorRole";
    const APPROVED_ROLES = ["contributor", "manager"];

    function unlockEditor() {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("appContent").style.display = "";
    }

    function rejectAccess(errorEl, message) {
      sessionStorage.removeItem(ACCESS_TOKEN_SESSION_KEY);
      sessionStorage.removeItem(ROLE_SESSION_KEY);
      errorEl.textContent = message;
    }

    async function tryLogin() {
      const emailEl = document.getElementById("lockEmail");
      const passwordEl = document.getElementById("lockPassword");
      const errorEl = document.getElementById("lockError");
      errorEl.textContent = "";
      try {
        const res = await fetch(`${LOGIN_API_BASE}/contributors/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailEl.value, password: passwordEl.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          rejectAccess(errorEl, "Invalid email or password.");
        } else if (res.status === 403) {
          rejectAccess(errorEl, "This account cannot access the editor.");
        } else if (!res.ok) {
          rejectAccess(errorEl, "Could not reach the server. Try again later.");
        } else if (!APPROVED_ROLES.includes(data.role)) {
          rejectAccess(errorEl, "Only approved contributors can use the editor. Your registration is pending approval.");
        } else {
          // Session-only (not localStorage) - closing the tab/browser asks
          // again, but repeated edits/reloads in one sitting don't re-prompt.
          sessionStorage.setItem(ACCESS_TOKEN_SESSION_KEY, data.access_token);
          sessionStorage.setItem(ROLE_SESSION_KEY, data.role);
          unlockEditor();
        }
      } catch (err) {
        rejectAccess(errorEl, "Could not reach the server. Try again later.");
      }
      passwordEl.value = "";
    }

    // Reached via contributor/index.html's post-login redirect
    // (?token=<access_token>) - already logged in there, so just confirm
    // the role is still approved via GET /contributors/status instead of
    // asking for credentials again.
    async function tryTokenFromUrl(token) {
      const errorEl = document.getElementById("lockError");
      try {
        const res = await fetch(`${LOGIN_API_BASE}/contributors/status?token=${encodeURIComponent(token)}`);
        const data = await res.json().catch(() => ({}));
        if (res.ok && APPROVED_ROLES.includes(data.role)) {
          sessionStorage.setItem(ACCESS_TOKEN_SESSION_KEY, token);
          sessionStorage.setItem(ROLE_SESSION_KEY, data.role);
          unlockEditor();
        } else {
          rejectAccess(errorEl, "Only approved contributors can use the editor. Your registration is pending approval.");
        }
      } catch (err) {
        rejectAccess(errorEl, "Could not reach the server. Try again later.");
      }
      // Don't leave the token sitting in the visible/bookmarkable URL.
      history.replaceState(null, "", window.location.pathname);
    }

    document.getElementById("unlockButton").addEventListener("click", tryLogin);
    document.getElementById("lockPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryLogin();
    });

    const urlToken = new URLSearchParams(window.location.search).get("token");
    if (urlToken) {
      tryTokenFromUrl(urlToken);
    } else if (
      sessionStorage.getItem(ACCESS_TOKEN_SESSION_KEY) &&
      APPROVED_ROLES.includes(sessionStorage.getItem(ROLE_SESSION_KEY))
    ) {
      unlockEditor();
    }

    const logEl = document.getElementById("log");
    function log(msg) {
      logEl.textContent += msg + "\n";
      console.log(msg);
    }

    function serverUrl() {
      return SERVER_URL;
    }

    // --- Type-dependent field visibility -------------------------------
    const typeEl = document.getElementById("type");
    const textFieldLabel = document.getElementById("textFieldLabel");
    const urlFieldLabel = document.getElementById("urlFieldLabel");
    const urlEl = document.getElementById("url");
    const startsAtFieldLabel = document.getElementById("startsAtFieldLabel");

    // The only live HLS endpoint that exists today (project-description.md
    // #8) - prefilled so publishing a livestream event doesn't require
    // knowing/typing it.
    const DEFAULT_LIVESTREAM_URL = "https://live.uuu.ee:4443/hls/stream.m3u8";

    function updateFieldsForType() {
      const type = typeEl.value;
      const isText = type === "text";
      const isLivestream = type === "livestream";
      textFieldLabel.style.display = isText ? "" : "none";
      urlFieldLabel.style.display = isText ? "none" : "";
      startsAtFieldLabel.style.display = isLivestream ? "" : "none";
      if (isLivestream && !urlEl.value) {
        urlEl.value = DEFAULT_LIVESTREAM_URL;
      }
    }
    typeEl.addEventListener("change", updateFieldsForType);
    updateFieldsForType();

    // --- Announce at: "Now" checkbox toggles the date/time picker -------
    // datetime-local inputs are local time, not UTC - toISOString() would
    // have prefilled the field with the UTC wall-clock time mislabeled as
    // local (e.g. an actual 14:00 local showing up as 12:00 for a UTC+2
    // browser). Build the "YYYY-MM-DDTHH:MM" string from local
    // getFullYear()/getMonth()/etc instead, matching what the input
    // itself expects.
    function toLocalDatetimeInputValue(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    const publishNowEl = document.getElementById("publishNow");
    const publishAtEl = document.getElementById("publishAt");
    const noNotificationEl = document.getElementById("noNotification");

    function setPublishNow(isNow) {
      publishNowEl.checked = isNow;
      publishAtEl.disabled = isNow;
      if (!isNow && !publishAtEl.value) {
        publishAtEl.value = toLocalDatetimeInputValue(new Date());
      }
    }

    publishNowEl.addEventListener("change", () => setPublishNow(publishNowEl.checked));

    // Checking "No notification" implies this isn't meant to go out right
    // this second - uncheck "Now" so the Announce-at time picker opens up
    // instead of staying disabled.
    noNotificationEl.addEventListener("change", () => {
      if (noNotificationEl.checked) {
        setPublishNow(false);
      }
    });

    // --- Tags: smart search / autocomplete against GET /tags ------------
    const tagsEl = document.getElementById("tags");
    const tagSuggestions = document.getElementById("tagSuggestions");
    let tagsFetchController = null;

    async function refreshTagSuggestions() {
      const value = tagsEl.value;
      const current = value.split(",").pop().trim();
      if (!current) {
        tagSuggestions.innerHTML = "";
        return;
      }
      if (tagsFetchController) tagsFetchController.abort();
      tagsFetchController = new AbortController();
      try {
        const res = await fetch(
          `${serverUrl()}/tags?q=${encodeURIComponent(current)}`,
          { signal: tagsFetchController.signal }
        );
        const data = await res.json();
        tagSuggestions.innerHTML = (data.tags || [])
          .map((t) => `<option value="${value.replace(/[^,]*$/, "")}${t}">`)
          .join("");
      } catch (err) {
        // ignore aborted/failed lookups - autocomplete is best-effort
      }
    }
    tagsEl.addEventListener("input", refreshTagSuggestions);

    // --- Submit -----------------------------------------------------------
    document.getElementById("eventForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const type = typeEl.value;
      const payload = {};

      if (type === "text") {
        payload.text = document.getElementById("text").value;
      }
      if (type === "livestream") {
        payload.startsAt = document.getElementById("startsAt").value || null;
      }

      const tags = document
        .getElementById("tags")
        .value.split(",")
        .map((t) => t.trim())
        .filter(Boolean);

      const body = {
        title: document.getElementById("title").value,
        summary: document.getElementById("summary").value,
        type,
        url: type === "text" ? "" : document.getElementById("url").value,
        publish_now: publishNowEl.checked,
        publish_at: publishNowEl.checked ? null : publishAtEl.value || null,
        send_notification: !document.getElementById("noNotification").checked,
        shelf_at: document.getElementById("shelfAt").value || null,
        tags,
        payload,
      };

      try {
        const res = await fetch(`${serverUrl()}/events/publish`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          log("Error " + res.status + ":\n" + JSON.stringify(data, null, 2));
          return;
        }
        log("Published:\n" + JSON.stringify(data, null, 2));
      } catch (err) {
        log("Error: " + err);
      }
    });
  </script>
</body>
</html>
