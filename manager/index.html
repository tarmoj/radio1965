<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio 1965 - Manager</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12100d;
      --fg: #f0e6d2;
      --accent: #42b649;
      --error: crimson;
      --field-bg: #201d18;
      --field-border: #3a362e;
      --dirty-bg: #2e4a1f;
      --delete-bg: #4a1f1f;
    }
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 2em auto;
      padding: 0 1em;
      max-width: 1400px;
    }
    label { display: block; margin-top: 1em; font-weight: bold; }
    input, textarea, select {
      font-size: 1em;
      padding: 0.4em;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      border-radius: 4px;
      color: var(--fg);
    }
    input[type="checkbox"] { width: auto; }
    button {
      padding: 0.5em 1em;
      background: var(--accent);
      color: #0a1a0b;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary { background: var(--field-bg); color: var(--fg); border: 1px solid var(--field-border); }
    #lockScreen { max-width: 320px; margin: 4em auto; text-align: center; }
    #lockError { color: var(--error); min-height: 1.2em; }

    .tabs { display: flex; gap: 0.5em; margin-bottom: 1em; }
    .tabs button.active { outline: 2px solid var(--fg); }

    .filterBar { display: flex; flex-wrap: wrap; gap: 0.5em; margin-bottom: 0.5em; }
    .filterBar input, .filterBar select { width: 160px; }

    .applyBar { display: flex; align-items: center; gap: 1em; margin-bottom: 1em; position: sticky; top: 0; background: var(--bg); padding: 0.5em 0; z-index: 1; }
    #applyStatus { opacity: 0.8; }

    table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
    th, td { border: 1px solid var(--field-border); padding: 0.3em; text-align: left; vertical-align: top; }
    th { background: var(--field-bg); }
    td input, td select, td textarea { width: 100%; min-width: 90px; }
    td textarea { resize: vertical; }
    td input[type="checkbox"] { width: auto; }
    tr.dirty > td { background: var(--dirty-bg); }
    tr.pending-delete > td { background: var(--delete-bg); }
    .rowActions { display: flex; flex-direction: column; gap: 0.3em; white-space: nowrap; }
    .deleteBtn { background: var(--error); color: white; }
    .deleteBtn.marked { background: var(--field-bg); color: var(--fg); border: 1px solid var(--error); }
    .undoBtn, .editBtn { background: var(--field-bg); color: var(--fg); border: 1px solid var(--field-border); padding: 0.3em 0.6em; font-size: 0.85em; }
    .recordingDeleteOption { display: block; font-weight: normal; font-size: 0.85em; margin-top: 0.3em; white-space: nowrap; }
    .readonly { opacity: 0.7; }

    .modalOverlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modalBox { background: var(--bg); border: 1px solid var(--field-border); border-radius: 6px; padding: 1.5em; width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; }
    .modalBox label { display: block; margin-top: 1em; font-weight: bold; }
    .modalBox input, .modalBox select, .modalBox textarea { width: 100%; margin-top: 0.3em; }
    .modalBox textarea { resize: vertical; }
    .modalActions { margin-top: 1.5em; display: flex; justify-content: flex-end; gap: 0.5em; }
  </style>
</head>
<body>
  <!-- project-description.md #11's Manager page - same server-side login
       (POST /contributors/login) and sessionStorage-session pattern as
       editor/index.html, kept deliberately close to it for consistency. -->
  <div id="lockScreen">
    <h1>Radio 1965 - Manager</h1>
    <label>Email
      <input id="lockEmail" type="email" autofocus />
    </label>
    <label>Password
      <input id="lockPassword" type="password" />
    </label>
    <div id="lockError"></div>
    <button id="unlockButton" type="button">Log in</button>
  </div>

  <div id="appContent" style="display: none">
    <h1>VÄIN - Manager</h1>

    <div class="tabs">
      <button id="eventsTabButton" class="active" type="button">Events</button>
      <button id="usersTabButton" type="button" style="display: none">Users</button>
    </div>

    <div id="eventsTab">
      <div class="applyBar">
        <button id="eventsApplyButton" type="button" disabled>Apply changes</button>
        <button id="eventsReloadButton" class="secondary" type="button">Reload</button>
        <span id="eventsApplyStatus"></span>
      </div>

      <div class="filterBar" id="eventsFilterBar"></div>

      <div style="overflow-x: auto">
        <table id="eventsTable">
          <thead><tr id="eventsHeaderRow"></tr></thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
    </div>

    <div id="usersTab" style="display: none">
      <div class="applyBar">
        <button id="usersApplyButton" type="button" disabled>Apply changes</button>
        <button id="usersReloadButton" class="secondary" type="button">Reload</button>
        <span id="usersApplyStatus"></span>
      </div>

      <div class="filterBar" id="usersFilterBar"></div>

      <table id="usersTable">
        <thead><tr id="usersHeaderRow"></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://live.uuu.ee/radio1965/api";
    const ACCESS_TOKEN_SESSION_KEY = "radio65ManagerAccessToken";
    const ROLE_SESSION_KEY = "radio65ManagerRole";
    const USER_ID_SESSION_KEY = "radio65ManagerUserId";
    const APPROVED_ROLES = ["contributor", "manager"];

    // Mirrors server/db.py's EVENT_TYPES/EVENT_STATUSES/USER_ROLES - kept
    // in sync by hand, same as editor/index.html's #type <select> options.
    const EVENT_TYPES = ["text", "audio", "video", "article", "webcontent", "livestream", "streamrecording"];
    const EVENT_STATUSES = ["unpublished", "new", "shelved", "archived"];
    const USER_ROLES = ["pending", "contributor", "manager", "banned", "deleted"];

    function serverUrl() { return SERVER_URL; }

    function unlockManager() {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("appContent").style.display = "";
    }

    function rejectAccess(errorEl, message) {
      sessionStorage.removeItem(ACCESS_TOKEN_SESSION_KEY);
      sessionStorage.removeItem(ROLE_SESSION_KEY);
      sessionStorage.removeItem(USER_ID_SESSION_KEY);
      errorEl.textContent = message;
    }

    async function tryLogin() {
      const emailEl = document.getElementById("lockEmail");
      const passwordEl = document.getElementById("lockPassword");
      const errorEl = document.getElementById("lockError");
      errorEl.textContent = "";
      try {
        const res = await fetch(`${serverUrl()}/contributors/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailEl.value, password: passwordEl.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          rejectAccess(errorEl, "Invalid email or password.");
        } else if (res.status === 403) {
          rejectAccess(errorEl, "This account cannot access the manager page.");
        } else if (!res.ok) {
          rejectAccess(errorEl, "Could not reach the server. Try again later.");
        } else if (!APPROVED_ROLES.includes(data.role)) {
          rejectAccess(errorEl, "Only contributors/managers can use this page.");
        } else {
          sessionStorage.setItem(ACCESS_TOKEN_SESSION_KEY, data.access_token);
          sessionStorage.setItem(ROLE_SESSION_KEY, data.role);
          sessionStorage.setItem(USER_ID_SESSION_KEY, String(data.id));
          unlockManager();
          initApp();
        }
      } catch (err) {
        rejectAccess(errorEl, "Could not reach the server. Try again later.");
      }
      passwordEl.value = "";
    }

    document.getElementById("unlockButton").addEventListener("click", tryLogin);
    document.getElementById("lockPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryLogin();
    });

    function accessToken() { return sessionStorage.getItem(ACCESS_TOKEN_SESSION_KEY); }
    function currentRole() { return sessionStorage.getItem(ROLE_SESSION_KEY); }
    function currentUserId() { return Number(sessionStorage.getItem(USER_ID_SESSION_KEY)); }

    // --- Generic grid helper -------------------------------------------
    // Both the Events and Users tabs share the same dirty-row/pending-
    // delete/Apply/filter shape, just with a different column list and
    // endpoint - factored into one small "grid" object per tab instead of
    // duplicating the logic twice.
    function createGrid(opts) {
      // opts: { columns, rows: [], idField, canEditRow(row), bodyEl,
      //         headerRowEl, filterBarEl, applyButtonEl, statusEl,
      //         patchUrl(id), deleteUrl(id) (optional), fetchRows() }
      const pendingEdits = new Map(); // id -> { field: value, ... }
      const pendingDeletes = new Map(); // id -> { deleteAudioFile: bool } | true
      const rowElements = new Map(); // id -> { tr, actionsCell }

      function currentValue(col, row) {
        const edits = pendingEdits.get(row[opts.idField]);
        return edits && col.field in edits ? edits[col.field] : row[col.field];
      }

      // Shared by both the (cramped) inline table cell and the edit popup
      // below - same control, just rendered at a different size, so a
      // value typed in either place behaves identically.
      function buildFieldControl(col, row) {
        const id = row[opts.idField];
        const value = currentValue(col, row);
        const editable = opts.canEditRow(row) && !col.readonly;
        let el;
        if (col.type === "select") {
          el = document.createElement("select");
          for (const option of col.options) {
            const optionEl = document.createElement("option");
            optionEl.value = option;
            optionEl.textContent = option;
            if (option === value) optionEl.selected = true;
            el.appendChild(optionEl);
          }
        } else if (col.type === "checkbox") {
          el = document.createElement("input");
          el.type = "checkbox";
          el.checked = !!value;
        } else if (col.type === "datetime-local") {
          el = document.createElement("input");
          el.type = "datetime-local";
          // Event dates come back as ISO strings with seconds/offset -
          // datetime-local inputs want "YYYY-MM-DDTHH:MM".
          el.value = value ? String(value).slice(0, 16) : "";
        } else if (col.multiline) {
          el = document.createElement("textarea");
          el.rows = 4;
          el.value = value == null ? "" : value;
        } else {
          el = document.createElement("input");
          el.type = "text";
          el.value = value == null ? "" : value;
        }
        el.disabled = !editable;
        if (!editable) el.classList.add("readonly");

        if (editable) {
          const commitEventName = (col.type === "select" || col.type === "checkbox") ? "change" : "input";
          el.addEventListener(commitEventName, () => {
            const newValue = col.type === "checkbox" ? el.checked : el.value;
            if (!pendingEdits.has(id)) pendingEdits.set(id, {});
            pendingEdits.get(id)[col.field] = newValue;
            // Deliberately NOT a full render() here - that would rebuild
            // every cell in the table on every keystroke and steal focus
            // right back out of the field being typed into (the original
            // bug that made inline editing nearly unusable). Only the
            // lightweight bits that need to react (dirty highlight, the
            // Undo button) get touched instead.
            markRowDirty(row);
          });
          if (col.type !== "select" && col.type !== "checkbox") {
            el.addEventListener("keydown", (e) => {
              if (e.key !== "Escape") return;
              e.preventDefault();
              // Esc cancels only the field currently being edited, back to
              // its last-saved (or last-staged) value - same convention
              // spreadsheets/Beekeeper Studio use. It deliberately does
              // NOT discard the rest of the row's pending edits or its
              // delete-mark - reverting a whole row at once is the
              // separate, more deliberate "Undo" button below.
              const edits = pendingEdits.get(id);
              if (edits && col.field in edits) {
                delete edits[col.field];
                if (Object.keys(edits).length === 0) pendingEdits.delete(id);
              }
              el.value = value == null ? "" : value;
              el.blur();
              markRowDirty(row);
            });
          }
        }
        return el;
      }

      function markRowDirty(row) {
        const id = row[opts.idField];
        const entry = rowElements.get(id);
        if (!entry) return;
        entry.tr.classList.toggle("dirty", pendingEdits.has(id));
        refreshActionsCell(row);
        updateApplyButton();
      }

      function refreshActionsCell(row) {
        const id = row[opts.idField];
        const entry = rowElements.get(id);
        if (!entry) return;
        entry.actionsCell.innerHTML = "";
        entry.actionsCell.appendChild(buildActionsCell(row));
      }

      function buildActionsCell(row) {
        const id = row[opts.idField];
        const canEdit = opts.canEditRow(row);
        const wrap = document.createElement("div");
        wrap.className = "rowActions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "editBtn";
        editBtn.textContent = "Edit...";
        editBtn.disabled = !canEdit;
        editBtn.addEventListener("click", () => openEditModal(row));
        wrap.appendChild(editBtn);

        if (pendingEdits.has(id)) {
          const undoBtn = document.createElement("button");
          undoBtn.type = "button";
          undoBtn.className = "undoBtn";
          undoBtn.textContent = "Undo edits";
          undoBtn.addEventListener("click", () => {
            pendingEdits.delete(id);
            rebuildRow(row);
            updateApplyButton();
          });
          wrap.appendChild(undoBtn);
        }

        if (opts.deleteUrl) {
          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "deleteBtn" + (pendingDeletes.has(id) ? " marked" : "");
          deleteBtn.textContent = pendingDeletes.has(id) ? "Undo delete" : "Delete";
          deleteBtn.disabled = !canEdit;
          deleteBtn.addEventListener("click", () => {
            if (pendingDeletes.has(id)) {
              pendingDeletes.delete(id);
            } else {
              pendingDeletes.set(id, { deleteAudioFile: false });
            }
            rebuildRow(row);
            updateApplyButton();
          });
          wrap.appendChild(deleteBtn);

          // Only shown once the row is actually marked for deletion - no
          // point asking about the audio file before "Delete" was pressed.
          if (pendingDeletes.has(id) && row.type === "streamrecording") {
            const label = document.createElement("label");
            label.className = "recordingDeleteOption";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = pendingDeletes.get(id).deleteAudioFile;
            checkbox.addEventListener("change", () => {
              pendingDeletes.get(id).deleteAudioFile = checkbox.checked;
            });
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(" also delete audio file"));
            wrap.appendChild(label);
          }
        }

        return wrap;
      }

      // Rebuilds one row's field cells + actions cell in place - used for
      // discrete clicks (Undo, Delete toggle) where losing focus doesn't
      // matter, as opposed to markRowDirty()'s lightweight path for
      // keystroke-level edits.
      function rebuildRow(row) {
        const id = row[opts.idField];
        const entry = rowElements.get(id);
        if (!entry) return;
        entry.tr.innerHTML = "";
        populateRow(entry.tr, row, entry);
      }

      function populateRow(tr, row, entry) {
        const id = row[opts.idField];
        tr.classList.toggle("dirty", pendingEdits.has(id));
        tr.classList.toggle("pending-delete", pendingDeletes.has(id));

        for (const col of opts.columns) {
          const td = document.createElement("td");
          td.appendChild(buildFieldControl(col, row));
          tr.appendChild(td);
        }

        const actionsTd = document.createElement("td");
        actionsTd.appendChild(buildActionsCell(row));
        tr.appendChild(actionsTd);
        entry.actionsCell = actionsTd;
      }

      // --- Edit popup ---------------------------------------------------
      // Same fields/controls as the inline row, just laid out full-width
      // and with room to breathe - for title/summary/url in particular,
      // the table cell is too narrow to comfortably type into.
      function openEditModal(row) {
        const overlay = document.createElement("div");
        overlay.className = "modalOverlay";
        const box = document.createElement("div");
        box.className = "modalBox";
        overlay.appendChild(box);

        for (const col of opts.columns) {
          if (col.readonly) continue;
          const label = document.createElement("label");
          label.textContent = col.label;
          label.appendChild(buildFieldControl(col, row));
          box.appendChild(label);
        }

        const actions = document.createElement("div");
        actions.className = "modalActions";
        const closeBtn = document.createElement("button");
        closeBtn.type = "button";
        closeBtn.textContent = "Close";
        closeBtn.addEventListener("click", () => {
          overlay.remove();
          rebuildRow(row); // reflect whatever was edited back into the table cells
          markRowDirty(row);
        });
        actions.appendChild(closeBtn);
        box.appendChild(actions);

        overlay.addEventListener("keydown", (e) => {
          // Escape here closes the whole popup (nothing to lose - every
          // field commits to pendingEdits as you type, same as inline),
          // not a single field - there's no "the one field being edited"
          // concept once several fields are visible at once side by side.
          if (e.key === "Escape") closeBtn.click();
        });

        document.body.appendChild(overlay);
        box.querySelector("input, textarea, select")?.focus();
      }

      function render() {
        opts.headerRowEl.innerHTML = "";
        for (const col of opts.columns) {
          const th = document.createElement("th");
          th.textContent = col.label;
          opts.headerRowEl.appendChild(th);
        }
        opts.headerRowEl.appendChild(document.createElement("th"));

        opts.filterBarEl.innerHTML = "";
        for (const col of opts.columns) {
          if (col.noFilter) continue;
          let filterEl;
          if (col.type === "select") {
            filterEl = document.createElement("select");
            const anyOption = document.createElement("option");
            anyOption.value = "";
            anyOption.textContent = `${col.label}: any`;
            filterEl.appendChild(anyOption);
            for (const option of col.options) {
              const optionEl = document.createElement("option");
              optionEl.value = option;
              optionEl.textContent = option;
              filterEl.appendChild(optionEl);
            }
          } else {
            filterEl = document.createElement("input");
            filterEl.placeholder = `Filter ${col.label}`;
          }
          filterEl.dataset.field = col.field;
          filterEl.addEventListener("input", renderBody);
          filterEl.addEventListener("change", renderBody);
          opts.filterBarEl.appendChild(filterEl);
        }

        const resetButton = document.createElement("button");
        resetButton.type = "button";
        resetButton.className = "secondary";
        resetButton.textContent = "Reset filters";
        resetButton.addEventListener("click", () => {
          for (const el of opts.filterBarEl.querySelectorAll("[data-field]")) el.value = "";
          renderBody();
        });
        opts.filterBarEl.appendChild(resetButton);

        renderBody();
      }

      function matchesFilters(row) {
        const filterEls = opts.filterBarEl.querySelectorAll("[data-field]");
        for (const filterEl of filterEls) {
          const value = filterEl.value;
          if (!value) continue;
          const rowValue = row[filterEl.dataset.field];
          if (filterEl.tagName === "SELECT") {
            if (rowValue !== value) return false;
          } else if (!String(rowValue == null ? "" : rowValue).toLowerCase().includes(value.toLowerCase())) {
            return false;
          }
        }
        return true;
      }

      function renderBody() {
        opts.bodyEl.innerHTML = "";
        rowElements.clear();
        for (const row of opts.rows) {
          if (!matchesFilters(row)) continue;
          const id = row[opts.idField];
          const tr = document.createElement("tr");
          const entry = { tr, actionsCell: null };
          rowElements.set(id, entry);
          populateRow(tr, row, entry);
          opts.bodyEl.appendChild(tr);
        }
      }

      function updateApplyButton() {
        opts.applyButtonEl.disabled = pendingEdits.size === 0 && pendingDeletes.size === 0;
      }

      async function apply() {
        opts.applyButtonEl.disabled = true;
        opts.statusEl.textContent = "Applying...";
        let failures = 0;

        for (const [id, fields] of pendingEdits) {
          try {
            const res = await fetch(opts.patchUrl(id), {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ access_token: accessToken(), ...fields }),
            });
            if (!res.ok) throw new Error(await res.text());
            pendingEdits.delete(id);
          } catch (err) {
            failures += 1;
            console.error(`Failed to update ${opts.idField}=${id}:`, err);
          }
        }

        if (opts.deleteUrl) {
          for (const [id, info] of pendingDeletes) {
            try {
              const qs = new URLSearchParams({
                access_token: accessToken(),
                delete_audio_file: info.deleteAudioFile ? "true" : "false",
              });
              const res = await fetch(`${opts.deleteUrl(id)}?${qs}`, { method: "DELETE" });
              if (!res.ok) throw new Error(await res.text());
              pendingDeletes.delete(id);
              opts.rows = opts.rows.filter((row) => row[opts.idField] !== id);
            } catch (err) {
              failures += 1;
              console.error(`Failed to delete ${opts.idField}=${id}:`, err);
            }
          }
        }

        opts.statusEl.textContent = failures > 0
          ? `Done, ${failures} change(s) failed - see console.`
          : "All changes applied.";
        // Re-fetch from the server rather than just re-rendering the
        // now-stale in-memory rows - picks up anything another manager
        // changed in the meantime, not just this tab's own edits.
        if (opts.reload) await opts.reload();
        else render();
        updateApplyButton();
      }

      opts.applyButtonEl.addEventListener("click", apply);
      render();
      return { render, setRows: (rows) => { opts.rows = rows; render(); } };
    }

    // --- Events tab -------------------------------------------------------
    const eventsColumns = [
      { field: "id", label: "ID", readonly: true },
      { field: "type", label: "Type", type: "select", options: EVENT_TYPES },
      { field: "title", label: "Title" },
      { field: "summary", label: "Summary", multiline: true },
      { field: "url", label: "URL" },
      { field: "status", label: "Status", type: "select", options: EVENT_STATUSES },
      { field: "publish_at", label: "Publish at", type: "datetime-local", noFilter: true },
      { field: "shelf_at", label: "Shelf at", type: "datetime-local", noFilter: true },
      { field: "author_id", label: "Author ID", readonly: true },
      { field: "created_at", label: "Created", readonly: true, noFilter: true },
    ];

    let eventsGrid = null;

    async function loadEvents() {
      const qs = new URLSearchParams();
      for (const status of ["new", "shelved", "unpublished", "archived"]) qs.append("status", status);
      qs.set("limit", "2000");
      const res = await fetch(`${serverUrl()}/events?${qs}`);
      const data = await res.json();
      const rows = data.events || [];
      if (eventsGrid) {
        eventsGrid.setRows(rows);
      } else {
        eventsGrid = createGrid({
          columns: eventsColumns,
          rows,
          idField: "id",
          canEditRow: (row) => currentRole() === "manager" || row.author_id === currentUserId(),
          bodyEl: document.getElementById("eventsBody"),
          headerRowEl: document.getElementById("eventsHeaderRow"),
          filterBarEl: document.getElementById("eventsFilterBar"),
          applyButtonEl: document.getElementById("eventsApplyButton"),
          statusEl: document.getElementById("eventsApplyStatus"),
          patchUrl: (id) => `${serverUrl()}/events/${id}`,
          deleteUrl: (id) => `${serverUrl()}/events/${id}`,
          reload: loadEvents,
        });
      }
    }

    document.getElementById("eventsReloadButton").addEventListener("click", loadEvents);

    // --- Users tab (manager only) -----------------------------------------
    const usersColumns = [
      { field: "id", label: "ID", readonly: true },
      { field: "name", label: "Name", readonly: true },
      { field: "email", label: "Email", readonly: true },
      { field: "role", label: "Role", type: "select", options: USER_ROLES },
      { field: "created_at", label: "Created", readonly: true, noFilter: true },
    ];

    let usersGrid = null;

    async function loadUsers() {
      const qs = new URLSearchParams({ access_token: accessToken() });
      const res = await fetch(`${serverUrl()}/users?${qs}`);
      if (!res.ok) return;
      const data = await res.json();
      const rows = data.users || [];
      if (usersGrid) {
        usersGrid.setRows(rows);
      } else {
        usersGrid = createGrid({
          columns: usersColumns,
          rows,
          idField: "id",
          canEditRow: () => true, // this whole tab is manager-only already
          bodyEl: document.getElementById("usersBody"),
          headerRowEl: document.getElementById("usersHeaderRow"),
          filterBarEl: document.getElementById("usersFilterBar"),
          applyButtonEl: document.getElementById("usersApplyButton"),
          statusEl: document.getElementById("usersApplyStatus"),
          patchUrl: (id) => `${serverUrl()}/users/${id}`,
          // No deleteUrl - deleting users isn't part of this page.
          reload: loadUsers,
        });
      }
    }

    document.getElementById("usersReloadButton").addEventListener("click", loadUsers);

    // --- Tabs ---------------------------------------------------------
    const eventsTabButton = document.getElementById("eventsTabButton");
    const usersTabButton = document.getElementById("usersTabButton");
    const eventsTab = document.getElementById("eventsTab");
    const usersTab = document.getElementById("usersTab");

    function showTab(name) {
      eventsTab.style.display = name === "events" ? "" : "none";
      usersTab.style.display = name === "users" ? "" : "none";
      eventsTabButton.classList.toggle("active", name === "events");
      usersTabButton.classList.toggle("active", name === "users");
    }
    eventsTabButton.addEventListener("click", () => showTab("events"));
    usersTabButton.addEventListener("click", () => showTab("users"));

    function initApp() {
      loadEvents();
      if (currentRole() === "manager") {
        usersTabButton.style.display = "";
        loadUsers();
      }
    }

    // Reached via the app's "Edit entries" (?token=<access_token>) -
    // already logged in there, so just confirm the role via
    // GET /contributors/status instead of asking for credentials again.
    async function tryTokenFromUrl(token) {
      const errorEl = document.getElementById("lockError");
      try {
        const res = await fetch(`${serverUrl()}/contributors/status?token=${encodeURIComponent(token)}`);
        const data = await res.json().catch(() => ({}));
        if (res.ok && APPROVED_ROLES.includes(data.role)) {
          sessionStorage.setItem(ACCESS_TOKEN_SESSION_KEY, token);
          sessionStorage.setItem(ROLE_SESSION_KEY, data.role);
          sessionStorage.setItem(USER_ID_SESSION_KEY, String(data.id));
          unlockManager();
          initApp();
        } else {
          rejectAccess(errorEl, "Only contributors/managers can use this page.");
        }
      } catch (err) {
        rejectAccess(errorEl, "Could not reach the server. Try again later.");
      }
      // Don't leave the token sitting in the visible/bookmarkable URL.
      history.replaceState(null, "", window.location.pathname);
    }

    const urlToken = new URLSearchParams(window.location.search).get("token");
    if (urlToken) {
      tryTokenFromUrl(urlToken);
    } else if (accessToken() && APPROVED_ROLES.includes(currentRole())) {
      unlockManager();
      initApp();
    }
  </script>
</body>
</html>
